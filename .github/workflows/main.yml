on:
  push:
    paths:
      - '**/*'
  pull_request:
    paths:
      - '**/*'

jobs:
  Build-Databricks-Apps:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Databricks CLI
      run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

    - name: Get Databricks Access Token using Service Principal
      run: |
        export CLIENT_ID=${{ secrets.DATABRICKS_CLIENT_ID_CICD }}
        export CLIENT_SECRET=${{ secrets.DATABRICKS_CLIENT_SECRET_CICD }}
        export TOKEN_ENDPOINT_URL="${{ secrets.DATABRICKS_HOST }}/oidc/v1/token"
        
        DATABRICKS_TOKEN=$(curl --request POST \
          --url "$TOKEN_ENDPOINT_URL" \
          --user "$CLIENT_ID:$CLIENT_SECRET" \
          --data 'grant_type=client_credentials&scope=all-apis' | jq -r .access_token)
        
        echo "DATABRICKS_TOKEN=$DATABRICKS_TOKEN" >> $GITHUB_ENV

    - name: Create Databricks Directory for apps
      run: |
        RESPONSE=$(curl --request POST \
          --url "${{ secrets.DATABRICKS_HOST }}/api/2.0/workspace/mkdirs" \
          --header "Authorization: Bearer $DATABRICKS_TOKEN" \
          --header "Content-Type: application/json" \
          --data '{"path": "/Workspace/apps"}')

        echo "response=$RESPONSE" >> $GITHUB_ENV
        echo "$RESPONSE"


    - name: Databricks sync
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN }}
      run: |
        echo "Checking out the releases branch"
        databricks -v 
        databricks sync ./apps/ /Workspace/apps --full 


    - name: Create Databricks app if not exists
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN }}
        SQL_WAREHOUSE: ${{ secrets.SQL_WAREHOUSE }}
        
      run: |

        for app_dir in $(find apps -mindepth 1 -maxdepth 1 -type d); do
          app_name=$(basename "$app_dir")
          if [[ $app_name == .* ]]; then
            echo "Skipping hidden directory: $app_name"
            continue
          fi
          echo "Processing app: $app_name"

          RESPONSE=$(curl --request POST \
          --url "${{ secrets.DATABRICKS_HOST }}/api/2.0/apps" \
          --header "Authorization: Bearer $DATABRICKS_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{\"name\": \"$app_name\", \"default_source_code_path\": \"/Workspace/apps/$app_name\", \"resources\": [{\"name\": \"sql-warehouse\", \"sql_warehouse\": {\"id\": \"$SQL_WAREHOUSE\", \"permission\": \"CAN_MANAGE\"}}]}")

        
          echo "Create app response: $RESPONSE"

          if echo "$RESPONSE" | grep -q "ALREADY_EXISTS"; then
            echo "App $app_name already exists. Skipping creation."
          elif echo "$RESPONSE" | grep -q "error_code"; then
            echo "Failed to create app $app_name:"
            echo "$RESPONSE"
            exit 1
          else
            echo "App creation initiated for $app_name. Polling for ACTIVE state..."
            # Wait until the app is in the ACTIVE state (with timeout)
            MAX_ATTEMPTS=30
            ATTEMPT=0
            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              APP_STATUS=$(curl -s --request GET \
                --url "${{ secrets.DATABRICKS_HOST }}/api/2.0/apps/$app_name" \
                --header "Authorization: Bearer $DATABRICKS_TOKEN" | jq -r '.compute_status.state // .status.state // empty')
              
              if [[ "$APP_STATUS" == "ACTIVE" ]]; then
                echo "App $app_name is ACTIVE"
                break
              fi
              
              echo "Waiting for app $app_name to become ACTIVE. Current state: ${APP_STATUS:-UNKNOWN} (Attempt $((ATTEMPT+1))/$MAX_ATTEMPTS)"
              sleep 15
              ATTEMPT=$((ATTEMPT+1))
            done

            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "Timed out waiting for app $app_name to become ACTIVE."
              exit 1
            fi
          fi

          # Deploy updated code to app
          echo "Deploying app $app_name..."
          databricks apps deploy $app_name --source-code-path /Workspace/apps/$app_name

        done



